name: Deploy to GitHub Pages

# Copies the game into the gh-pages branch, which Pages serves ("Deploy from a branch").
# Runs on main and on every Claude session branch, so each session's work is previewable when it pushes.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish game files to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r js _site/
          touch _site/.nojekyll
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Deploy ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
